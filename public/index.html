<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobalChat · Video Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════ JOIN SCREEN -->
  <div id="join-screen" class="screen active">
    <div class="join-bg">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
      <div class="grid-overlay"></div>
    </div>

    <div class="join-card">
      <div class="logo-mark">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="19" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="20" cy="20" r="6" fill="var(--accent)"/>
          <line x1="20" y1="1" x2="20" y2="9" stroke="var(--accent)" stroke-width="2"/>
          <line x1="20" y1="31" x2="20" y2="39" stroke="var(--accent)" stroke-width="2"/>
          <line x1="1" y1="20" x2="9" y2="20" stroke="var(--accent)" stroke-width="2"/>
          <line x1="31" y1="20" x2="39" y2="20" stroke="var(--accent)" stroke-width="2"/>
        </svg>
      </div>
      <h1 class="brand">GLOBALCHAT</h1>
      <p class="tagline">Live video · anywhere · no account needed</p>

      <div class="form-group">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" placeholder="e.g. Nikki" maxlength="24" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="code-input">Access code</label>
        <div class="code-wrap">
          <input id="code-input" type="password" placeholder="••••" maxlength="8" autocomplete="off" />
          <button class="eye-btn" id="toggle-eye" title="Show/hide">
            <svg id="eye-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="join-error" class="error-msg hidden"></div>

      <button id="join-btn" class="btn-primary">
        <span>Enter Room</span>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <p class="hint">Works on desktop & mobile · Peer-to-peer encrypted</p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════ MAIN ROOM -->
  <div id="room-screen" class="screen">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo-sm">GC</span>
        <span class="room-label">Global Room</span>
        <span class="dot-live"></span>
        <span id="peer-count" class="peer-count">1 participant</span>
      </div>
      <div class="topbar-right">
        <button id="btn-mic" class="ctrl-btn active" title="Mute/unmute">
          <svg class="icon-mic" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M19 10a7 7 0 0 1-14 0"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button id="btn-cam" class="ctrl-btn active" title="Camera on/off">
          <svg class="icon-cam" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2"/>
          </svg>
        </button>
        <button id="btn-chat" class="ctrl-btn" title="Chat">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span id="chat-badge" class="badge hidden">0</span>
        </button>
        <button id="btn-leave" class="ctrl-btn danger" title="Leave">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Video grid -->
    <main class="video-area" id="video-grid">
      <!-- Local tile injected by JS -->
    </main>

    <!-- Chat panel -->
    <aside class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <span>Room Chat</span>
        <button id="close-chat">✕</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Say something…" maxlength="500" autocomplete="off" />
        <button id="chat-send">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </aside>

    <!-- Notification toast -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
